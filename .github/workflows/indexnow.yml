name: IndexNow

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: false

jobs:
  submit:
    name: Submit changed URLs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ping IndexNow
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/indexnow.mjs --changed --wait
