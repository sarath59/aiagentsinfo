name: IndexNow

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: false

jobs:
  submit:
    name: Submit changed URLs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ping IndexNow
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        # The script exits 0 when api.indexnow.org or any engine returns
        # 200/202. One endpoint failing is logged as a warning. Every
        # endpoint failing, or a key file that never goes live, still fails.
        run: node scripts/indexnow.mjs --changed --wait
